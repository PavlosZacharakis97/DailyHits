<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 100" width="264" height="100" font-family="Nunito, Poppins, 'SF Pro Rounded', ui-rounded, system-ui, sans-serif">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cf0"/><stop offset="1" stop-color="#e58bbf"/>
    </linearGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5cf0"/><stop offset="1" stop-color="#c06ad8"/>
    </linearGradient>
    <radialGradient id="label" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe0bf"/><stop offset="1" stop-color="#f7a8a0"/>
    </radialGradient>
    <linearGradient id="eq" gradientUnits="userSpaceOnUse" x1="106" y1="0" x2="243" y2="0">
      <stop offset="0" stop-color="#a8e6e0"/><stop offset=".5" stop-color="#c9a8ff"/><stop offset="1" stop-color="#f7a8cf"/>
    </linearGradient>
  </defs>

  <!-- значок: пластинка -->
  <rect x="8" y="10" width="80" height="80" rx="22" fill="url(#tile)"/>
  <circle cx="48" cy="50" r="30" fill="#2b2048"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1">
    <circle cx="48" cy="50" r="26"/><circle cx="48" cy="50" r="22.5"/><circle cx="48" cy="50" r="19"/><circle cx="48" cy="50" r="15.5"/>
  </g>
  <g>
    <path d="M30 36 A24 24 0 0 1 48 26" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="50" r="11" fill="url(#label)"/>
    <path d="M38 53 C42 50 45 51 48 53 S55 56 58 52" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 48 50" to="360 48 50" dur="8s" repeatCount="indefinite"/>
  </g>
  <circle cx="48" cy="50" r="2" fill="#2b2048"/>
  <!-- нота -->
  <g fill="#ffffff">
    <ellipse cx="68" cy="30" rx="4" ry="3.1" transform="rotate(-20 68 30)"/>
    <ellipse cx="78" cy="27.5" rx="4" ry="3.1" transform="rotate(-20 78 27.5)"/>
    <rect x="70.6" y="17" width="1.9" height="13"/>
    <rect x="80.6" y="14.5" width="1.9" height="13"/>
    <path d="M70.6 17 L82.5 14.5 V18.3 L70.6 20.8Z"/>
  </g>

  <!-- надпись -->
  <text x="104" y="58" font-size="44" font-weight="800" fill="url(#word)" letter-spacing="-1">dailyhit</text>

  <!-- эквалайзер -->
  <g fill="url(#eq)">
    <rect x="106" y="74" width="4" height="10" rx="2"><animate attributeName="height" values="10;4;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="74;80;74" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="113" y="70" width="4" height="14" rx="2"/>
    <rect x="120" y="76" width="4" height="8" rx="2"><animate attributeName="height" values="8;14;8" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="76;70;76" dur=".9s" repeatCount="indefinite"/></rect>
    <rect x="127" y="72" width="4" height="12" rx="2"/>
    <rect x="134" y="78" width="4" height="6" rx="2"/>
    <rect x="141" y="70" width="4" height="14" rx="2"><animate attributeName="height" values="14;6;14" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="70;78;70" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="148" y="74" width="4" height="10" rx="2"/>
    <rect x="155" y="68" width="4" height="16" rx="2"><animate attributeName="height" values="16;8;16" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="68;76;68" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="162" y="76" width="4" height="8" rx="2"/>
    <rect x="169" y="71" width="4" height="13" rx="2"/>
    <rect x="176" y="77" width="4" height="7" rx="2"><animate attributeName="height" values="7;13;7" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="77;71;77" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="183" y="73" width="4" height="11" rx="2"/>
    <rect x="190" y="69" width="4" height="15" rx="2"><animate attributeName="height" values="15;7;15" dur=".95s" repeatCount="indefinite"/><animate attributeName="y" values="69;77;69" dur=".95s" repeatCount="indefinite"/></rect>
    <rect x="197" y="75" width="4" height="9" rx="2"/>
    <rect x="204" y="72" width="4" height="12" rx="2"/>
    <rect x="211" y="78" width="4" height="6" rx="2"><animate attributeName="height" values="6;12;6" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="78;72;78" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="218" y="74" width="4" height="10" rx="2"/>
    <rect x="225" y="77" width="4" height="7" rx="2"/>
    <rect x="232" y="72" width="4" height="12" rx="2"><animate attributeName="height" values="12;5;12" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="72;79;72" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="239" y="78" width="4" height="6" rx="2"/>
  </g>
</svg>
