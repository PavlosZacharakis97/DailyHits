# genre: [styles]
genres:
  Pop: [Dance-Pop, Synth-Pop, Electropop, Teen Pop, Indie Pop, K-Pop, Pop Ballad]
  Rock: [Rock and Roll, Classic Rock, Hard Rock, Glam Rock, Soft Rock, Pop Rock, Punk Rock,
         New Wave, Alternative Rock, Grunge, Indie Rock, Progressive Rock]
  Metal: [Heavy Metal, Glam Metal, Thrash Metal, Nu Metal]
  Hip-Hop: [Pop Rap, Gangsta Rap, Trap, Boom Bap]
  R&B/Soul: [Soul, Motown, Contemporary R&B, Neo Soul]
  Electronic: [House, Techno, Trance, Eurodance, EDM, Drum and Bass]
  Disco/Funk: [Disco, Funk, Nu-Disco]
  Country: [Classic Country, Country Pop, Country Rock]
  Folk: [Folk Rock, Singer-Songwriter, Indie Folk]
  Latin: [Latin Pop, Reggaeton, Salsa, Bachata, Bossa Nova]
  Reggae: [Roots Reggae, Ska, Dancehall]
  Jazz/Blues: [Vocal Jazz, Swing, Blues, Blues Rock]
  Classical/Soundtrack: [Film Score, Musical Theatre, Classical Crossover]

# Symmetric pairs: a guess in a related genre gets a yellow genre tile.
related_genres:
  - [Rock, Metal]
  - [Rock, Folk]
  - [Rock, Jazz/Blues]
  - [Pop, Electronic]
  - [Pop, R&B/Soul]
  - [Pop, Disco/Funk]
  - [Hip-Hop, R&B/Soul]
  - [R&B/Soul, Disco/Funk]
  - [R&B/Soul, Jazz/Blues]
  - [Electronic, Disco/Funk]
  - [Country, Folk]
  - [Latin, Reggae]

# group: [themes] — by the meaning of the lyrics, not the mood of the music.
themes:
  Love: [Falling in Love, Breakup / Heartbreak, Passion / Desire, Jealousy / Infidelity]
  Fun: [Party / Dancing, Freedom / Carefree, Summer / Holiday]
  Life & Feelings: [Nostalgia / Memories, Loneliness / Sadness, Motivation / Strength,
                    Growing Up / Self-Discovery]
  Society: [Protest / Politics, War / Peace, Social Issues, Money / Success]
  Stories: [Story / Character, City / Place, Road / Journey]
  Special: [Religion / Spirituality, Death / Loss, Fantasy / Surreal]
