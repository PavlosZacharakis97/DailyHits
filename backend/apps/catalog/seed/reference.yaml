# Reference data loaded by `python manage.py seed_reference`.
# The command is idempotent: it creates missing rows and updates changed ones,
# keyed by `code` / `iso_code` / `name`. It never deletes anything.

editions:
  - {code: world, name: World Hits, timezone: UTC, is_active: true}

regions:
  - {code: europe, name: Europe}
  - {code: north-america, name: North America}
  - {code: latin-america, name: Latin America}
  - {code: asia, name: Asia}
  - {code: oceania, name: Oceania}
  - {code: mena, name: Middle East & North Africa}
  - {code: sub-saharan-africa, name: Sub-Saharan Africa}

