songs:
  - title: Bohemian Rhapsody
    artist: Queen
    year: 1975
    genre: Rock
    styles: [Progressive Rock, Hard Rock]
    vocal: male
    language: en
    themes: [Story / Character, Death / Loss]   # first one is primary
    difficulty: easy
    youtube: fJ9rUzIMcZQ
    aliases: [Bohemian Rapsody]
    source: https://en.wikipedia.org/wiki/Bohemian_Rhapsody
    facts:
      - [easy, "It has no chorus at all: it moves from a ballad through an operatic passage to a hard rock section."]
      - [medium, "It topped the UK chart for nine weeks, then spent five more weeks at number one in 1991 after the singer's death."]
      - [strong, "A 2018 biopic about the band and its frontman shares its name with this song."]

