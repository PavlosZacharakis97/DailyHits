songs:
  - title: Bohemian Rhapsody
    artist: Queen
    year: 1975
    genre: Rock
    styles: [Progressive Rock, Hard Rock]
    vocal: male
    language: en
    themes: [Story / Character, Death / Loss]   # first one is primary
    difficulty: easy
    youtube: fJ9rUzIMcZQ
    aliases: [Bohemian Rapsody]
    source: https://en.wikipedia.org/wiki/Bohemian_Rhapsody
    facts:
      - [easy, "It has no chorus at all: it moves from a ballad through an operatic passage to a hard rock section."]
      - [medium, "It topped the UK chart for nine weeks, then spent five more weeks at number one in 1991 after the singer's death."]
      - [strong, "A 2018 biopic about the band and its frontman shares its name with this song."]

  - title: Billie Jean
    artist: Michael Jackson
    year: 1982
    genre: Pop
    styles: [Dance-Pop, Funk]
    vocal: male
    language: en
    themes: [Story / Character]
    difficulty: easy
    youtube: Zi_XLOBDo_Y
    aliases: [Billy Jean]
    source: https://en.wikipedia.org/wiki/Billie_Jean
    facts:
      - [easy, "It was released in January 1983 as the second single from the singer's sixth studio album."]
      - [medium, "It reached number one on the Billboard Hot 100 in March 1983 and stayed there for seven weeks."]
      - [strong, "Performing it on the TV special Motown 25, the singer introduced the moonwalk."]

  - title: Smells Like Teen Spirit
    artist: Nirvana
    year: 1991
    genre: Rock
    styles: [Grunge, Alternative Rock]
    vocal: male
    language: en
    themes: [Growing Up / Self-Discovery, Social Issues]
    difficulty: medium
    youtube: hTWKbfoikeg
    aliases: [Smells Like Teenspirit]
    source: https://en.wikipedia.org/wiki/Smells_Like_Teen_Spirit
    facts:
      - [easy, "It is the opening track and lead single of the band's second album, released in 1991."]
      - [medium, "Its writer set out to create the ultimate pop song, borrowing the soft-and-loud dynamics of the Pixies."]
      - [strong, "Its name comes from a deodorant: a riot grrrl singer wrote on a wall that the band's frontman smelled like it."]

  - title: Despacito
    artist: Luis Fonsi
    featured: [Daddy Yankee]
    year: 2017
    genre: Latin
    styles: [Reggaeton, Latin Pop]
    vocal: male
    language: es
    themes: [Passion / Desire]
    difficulty: easy
    youtube: kJQP7kiw5Fk
    aliases: [Despasito, Деспасито]
    source: https://en.wikipedia.org/wiki/Despacito
    facts:
      - [easy, "Its music video was shot in the La Perla neighbourhood of Old San Juan."]
      - [medium, "It was the first Spanish-language song to top the Billboard Hot 100 since “Macarena” in 1996."]
      - [strong, "Its video was the most-viewed on YouTube from 2017 to 2020 and the first to reach three billion views."]

  - title: Rolling in the Deep
    artist: Adele
    year: 2010
    genre: R&B/Soul
    styles: [Soul]
    vocal: female
    language: en
    themes: [Breakup / Heartbreak]
    difficulty: medium
    youtube: rYEDA3JcQqw
    aliases: [Rolling in the Deap]
    source: https://en.wikipedia.org/wiki/Rolling_in_the_Deep
    facts:
      - [easy, "It was written with producer Paul Epworth in a single afternoon, shortly after a breakup."]
      - [medium, "It is the lead single and opening track of the singer's second album, and it spent seven weeks at number one in the US."]
      - [strong, "At the 2012 Grammys it won both Record of the Year and Song of the Year."]

  - title: Gangnam Style
    artist: PSY
    year: 2012
    genre: Pop
    styles: [K-Pop, Dance-Pop]
    vocal: male
    language: ko
    themes: [Party / Dancing, Money / Success]
    difficulty: easy
    youtube: 9bZkp7q19f0
    aliases: [Gangam Style, Oppa Gangnam Style]
    source: https://en.wikipedia.org/wiki/Gangnam_Style
    facts:
      - [easy, "On 21 December 2012 its video became the first on YouTube to reach one billion views."]
      - [medium, "It satirises the flashy lifestyle associated with an affluent district of Seoul."]
      - [strong, "Its video made the singer's “invisible horse” dance a worldwide craze."]

  - title: Shape of You
    artist: Ed Sheeran
    year: 2017
    genre: Pop
    styles: [Dance-Pop, Dancehall]
    vocal: male
    language: en
    themes: [Passion / Desire, Falling in Love]
    difficulty: easy
    youtube: JGwWNGJdvx8
    aliases: [Shape of U]
    source: https://en.wikipedia.org/wiki/Shape_of_You
    facts:
      - [easy, "It was released on 6 January 2017, the same day as another single from the same album."]
      - [medium, "It was first written for Little Mix, then imagined as a duet for other artists, before the label boss persuaded the writer to keep it."]
      - [strong, "It comes from the singer-songwriter's album whose title is the division sign, ÷."]

  - title: Dancing Queen
    artist: ABBA
    year: 1976
    genre: Disco/Funk
    styles: [Disco]
    vocal: female
    language: en
    themes: [Party / Dancing]
    difficulty: medium
    youtube: xFrGuyw1V8s
    aliases: [Dansing Queen]
    source: https://en.wikipedia.org/wiki/Dancing_Queen
    facts:
      - [easy, "It was first performed live on 18 June 1976 at a gala at the Royal Swedish Opera honouring King Carl XVI Gustaf and his bride-to-be."]
      - [medium, "It was the group's only number-one hit in the United States, and it topped the charts in 15 other countries."]
      - [strong, "The band wanted it to be the follow-up single to their hit “Mamma Mia”."]

  - title: Blinding Lights
    artist: The Weeknd
    year: 2019
    genre: Pop
    styles: [Synth-Pop]
    vocal: male
    language: en
    themes: [Loneliness / Sadness, Passion / Desire]
    difficulty: medium
    youtube: 4NRXx6U8ABQ
    aliases: [Blinding Light]
    source: https://en.wikipedia.org/wiki/Blinding_Lights
    facts:
      - [easy, "Released on 29 November 2019, it is a deliberate callback to the sound of 1980s synth-pop."]
      - [medium, "It spent a record 57 weeks in the top ten of the Billboard Hot 100."]
      - [strong, "The singer performed it during his headlining set at the Super Bowl LV halftime show."]

  - title: No Woman, No Cry
    artist: Bob Marley & The Wailers
    year: 1974
    genre: Reggae
    styles: [Roots Reggae]
    vocal: male
    language: en
    themes: [Nostalgia / Memories, Motivation / Strength]
    difficulty: hard
    youtube: IT8XvzIfi4U
    aliases: [No Woman No Cry]
    source: https://en.wikipedia.org/wiki/No_Woman,_No_Cry
    facts:
      - [easy, "It first came out on a 1974 studio album, but the live recording made at London's Lyceum Theatre in July 1975 became the best-known version."]
      - [medium, "The songwriting credit went to Vincent Ford, a friend who ran a soup kitchen in Trenchtown, Kingston."]
      - [strong, "The lyrics look back on the singer's youth in Trenchtown, the Kingston neighbourhood where he grew up."]

