[project]
name = "dailyhit-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "RUF"]
# Django declares options as mutable class attributes (list_display = [...]).
ignore = ["RUF012"]
# En dashes are intentional in user-facing text (“1–2 styles”).
allowed-confusables = ["–"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
