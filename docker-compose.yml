# Local development: db + backend + frontend.
# Data lives in the named volume db_data and survives `docker compose down`.
# WARNING: `docker compose down -v` deletes the volume, i.e. the whole database.
name: dailyhit

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Dev only, bound to localhost so DB tools on the host can connect.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules; the host's macOS one is not compatible.
      - /app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"

volumes:
  db_data:
